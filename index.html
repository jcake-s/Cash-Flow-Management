<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Paycheck budgeting calculator.">
    <title>Cash Flow Management</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="budget-container">
        <h1>Paycheck Budget Calculator</h1>
        <p class="subtitle">50-15-5-30 Budgeting Rule</p>

        <form id="budgetform" onsubmit="handleBudgetSubmit(event)">
            <div class="input-group">
                <label for="incomeInput">Total Paycheck / Income</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input
                        type="number"
                        id="incomeInput"
                        placeholder="e.g. 3000"
                        step="0.01"
                        min="0.01"
                        required
                    />
                </div>
            </div>

            <button type="submit" class="calculator-btn">Calculate Budget</button>
        </form>

        <section id="resultSection" class="results-section" aria-live="polite">
            <ul class="breakdown-list">
                <li class="breakdown-item needs">
                    <span class="category-label">Needs (50%)</span>
                    <span id="needsValue" class="category-value">₱0.00</span>
                </li>
                <li class="breakdown-item savings">
                    <span class="category-label">Savings/Investments (15%)</span>
                    <span id="savingsValue" class="category-value">₱0.00</span>
                </li>
                <li class="breakdown-item short-item">
                    <span class="category-label">Short-term Goals (5%)</span>
                    <span id="wantsValue" class="category-value">₱0.00</span>
                </li>
            </ul>

            <div class="total-row">
                <span>Total Allocated</span>
                <span id="totalValue">₱0.00</span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered successfully.'))
                .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
